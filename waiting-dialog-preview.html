<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorySpring — Waiting Preview</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e9e0}main{width:min(100%,680px)}#ss-preview{background:rgba(41,43,38,.12);border-radius:18px}button{cursor:pointer}*{box-sizing:border-box}</style></head><body><main><div id="ss-preview" class="viz-dotted-background">
<style>
#ss-preview{color-scheme:light dark;padding:30px 14px;font:14px/1.6 Arial,sans-serif;color:light-dark(#292b26,#e5e7de)}#ss-preview .dialog{max-width:420px;margin:auto;padding:28px;background:light-dark(#faf9f4,#252820);border:1px solid light-dark(#dedfd4,#454a3d);border-radius:14px}#ss-preview h2{font:600 22px/1.4 Arial,sans-serif;margin:20px 0 10px}#ss-preview p{color:light-dark(#696d60,#bbc0b1)}#ss-preview .estimate{padding:14px;background:light-dark(#efefe5,#34392c);border-radius:8px;margin:20px 0}#ss-preview small{display:block;font-size:12px;margin-top:6px}#ss-preview .status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#ss-preview .track{height:5px;background:light-dark(#e7e8dd,#414735);overflow:hidden;border-radius:8px;margin:16px 0 24px}#ss-preview .bar{height:100%;width:30%;background:light-dark(#58674a,#b4c595);animation:ss-slide 2.5s ease-in-out infinite}@keyframes ss-slide{from{transform:translateX(-110%)}to{transform:translateX(440%)}}@media(prefers-reduced-motion:reduce){#ss-preview .bar{animation:none}}#ss-preview .controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}#ss-preview button{padding:10px;font:12px Arial,sans-serif;background:light-dark(#faf9f4,#252820);color:inherit;border:1px solid light-dark(#dedfd4,#454a3d);border-radius:6px}
</style>
<section class="dialog" role="dialog" aria-labelledby="ss-heading"><strong>StorySpring</strong><h2 id="ss-heading">Creating your next question</h2><p>Preparing a new question and options based on your answers.</p><div class="estimate"><strong id="ss-estimate">Estimated generation time: 20–40 seconds</strong><small id="ss-note">Timing may vary. This is an estimate, not a countdown.</small></div><div class="status"><span id="ss-status" role="status" aria-live="polite">Generating question &amp; options…</span><span id="ss-elapsed">Elapsed: 12s</span></div><div class="track" aria-hidden="true"><div class="bar"></div></div><small>Please keep this page open. Your answers are saved.</small></section>
<div class="controls"><button type="button" class="cursor-interaction" data-i="0">Preview: Queued</button><button type="button" class="cursor-interaction" data-i="1">Generating</button><button type="button" class="cursor-interaction" data-i="2">Taking longer</button></div>
<script>
(()=>{const r=document.getElementById('ss-preview'),data=[['Your request is in the queue','Queue position: 3','Generation estimate will appear when processing starts.','Waiting for an available slot…','Elapsed: 8s'],['Creating your next question','Estimated generation time: 20–40 seconds','Timing may vary. This is an estimate, not a countdown.','Generating question & options…','Elapsed: 12s'],['Still working on your question','Longer than expected','A reliable remaining-time estimate is currently unavailable.','Your request is still processing…','Elapsed: 52s']];r.querySelectorAll('button').forEach(b=>b.onclick=()=>['heading','estimate','note','status','elapsed'].forEach((k,i)=>r.querySelector('#ss-'+k).textContent=data[Number(b.dataset.i)][i]));})();
</script>
</div>
</main></body></html>
